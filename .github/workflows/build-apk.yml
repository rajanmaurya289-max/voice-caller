# Phone se APK banane ke liye GitHub par is filename se save karo:
# .github/workflows/build-apk.yml
# Is file mein app ka complete source embedded hai. Extra ZIP upload nahi chahiye.
name: Build Voice AI Assistant APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          voice_sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -f "$voice_sdk_root/platforms/android-35/android.jar"
          test -d "$voice_sdk_root/build-tools/35.0.0"
          echo "ANDROID_HOME=$voice_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$voice_sdk_root" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Create app source
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, json, zlib
          from pathlib import Path
          payload = ""
          files = json.loads(zlib.decompress(base64.b64decode(payload)))
          for name, content in files.items():
              path = Path("voice-caller") / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          PYCODE
      - name: Test contact matching and build APK
        working-directory: voice-caller
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAI-Assistant-APK
          path: voice-caller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
